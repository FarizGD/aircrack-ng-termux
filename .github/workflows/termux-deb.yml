name: Termux diagnostic package

on:
  push:
    branches: [master]
    paths:
      - scripts/check-termux-environment.sh
      - packaging/termux/**
      - .github/workflows/termux-deb.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke-test PCAP parser on synthetic input
        run: |
          python3 - <<'PY'
          import struct
          with open("smoke.pcap", "wb") as f:
              f.write(struct.pack("<IHHIIII", 0xa1b2c3d4, 2, 4, 0, 0, 65535, 1))
              f.write(struct.pack("<IIII", 1, 250000, 4, 4))
              f.write(b"test")
          PY
          python3 scripts/pcap-summary.py smoke.pcap --json > summary.json
          python3 - <<'PY'
          import json
          d = json.load(open("summary.json"))
          assert d["packet_count"] == 1
          assert d["captured_bytes"] == 4
          assert d["link_type"] == 1
          print("PCAP smoke test passed")
          PY

      - name: Build architecture-independent .deb
        run: |
          set -euo pipefail
          VERSION="0.1.0"
          PKG="aircrack-ng-termux-diagnostics"
          ARCH="all"
          ROOT="${RUNNER_TEMP}/pkgroot"
          mkdir -p "$ROOT/data/data/com.termux/files/usr/bin" "$ROOT/data/data/com.termux/files/usr/share/doc/$PKG" "$ROOT/DEBIAN"

          install -m 0755 scripts/check-termux-environment.sh \
            "$ROOT/data/data/com.termux/files/usr/bin/aircrack-ng-termux-diagnostics"

          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: $PKG
          Version: $VERSION
          Architecture: $ARCH
          Maintainer: FarizGD
          Section: utils
          Priority: optional
          Description: Read-only Android and Termux environment diagnostics
           Reports platform, tool availability, package state, root status,
           SELinux mode, and visible network interfaces.
          EOF

          install -m 0644 docs/TERMUX.md "$ROOT/data/data/com.termux/files/usr/share/doc/$PKG/README"
          cat > "$ROOT/DEBIAN/copyright" <<'EOF'
          Format: https://www.debian.org/doc/packaging-manuals/copyright-format/1.0/
          Files: *
          Copyright: 2026 FarizGD
          License: GPL-2.0-or-later
          EOF

          dpkg-deb --root-owner-group --build "$ROOT" "${PKG}_${VERSION}_${ARCH}.deb"
          dpkg-deb --info "${PKG}_${VERSION}_${ARCH}.deb"
          dpkg-deb --contents "${PKG}_${VERSION}_${ARCH}.deb"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-diagnostics-deb
          path: aircrack-ng-termux-diagnostics_0.1.0_all.deb
          if-no-files-found: error
          retention-days: 30
